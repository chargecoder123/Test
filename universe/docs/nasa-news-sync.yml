name: Sync NASA updates

# Keeps the bundled snapshot in `universe/src/data/nasa-news.json` current, so
# the Universe site's news page reflects NASA's latest posts even when it is
# hosted as static files with no server-side endpoint.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'universe/scripts/sync-nasa-news.mjs'
      - 'universe/server/nasa-news.mjs'

permissions:
  contents: write

concurrency:
  group: nasa-news-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch the latest NASA updates
        working-directory: universe
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
        run: |
          npm ci
          npm run sync:nasa

      - name: Commit any new updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add universe/src/data/nasa-news.json
          if git diff --cached --quiet; then
            echo "No new NASA updates."
            exit 0
          fi
          git commit -m "Update NASA news snapshot [skip ci]"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
